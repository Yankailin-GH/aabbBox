server {
    listen 8082;
    server_name _;
    charset utf-8;

    location = /aabbBox {
        return 301 /aabbBox/;
    }

    location /aabbBox/ {
        alias /Users/edy/myProject/aabbBox/frontend/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
