<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 420" width="100" height="420">
  <defs>
    <linearGradient id="ultStaffBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="25%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="ultCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="ultGlow" x="-40%" y="-10%" width="180%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#ultGlow)">
    <!-- 破空下落金焰气浪 -->
    <path d="M 30 10 L 70 10 L 85 390 L 50 415 L 15 390 Z" fill="#f59e0b" opacity="0.3" />
    <path d="M 38 40 L 62 40 L 75 390 L 50 410 L 25 390 Z" fill="#fde047" opacity="0.4" />
    <!-- 巨型如意棒身 -->
    <rect x="35" y="45" width="30" height="320" rx="4" fill="url(#ultStaffBody)" stroke="#7f1d1d" stroke-width="2" />
    <!-- 符文与如意金纹 -->
    <path d="M 50 60 V 350 M 43 90 H 57 M 43 150 H 57 M 43 210 H 57 M 43 270 H 57 M 43 330 H 57" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <!-- 顶部金箍 -->
    <rect x="25" y="20" width="50" height="35" rx="5" fill="url(#ultCapGrad)" stroke="#a16207" stroke-width="3" />
    <circle cx="50" cy="37" r="5" fill="#ffffff" />
    <!-- 底部金箍（砸地端） -->
    <rect x="25" y="360" width="50" height="40" rx="5" fill="url(#ultCapGrad)" stroke="#a16207" stroke-width="3" />
    <circle cx="50" cy="380" r="5" fill="#ffffff" />
    <!-- 砸击底部锋芒 -->
    <polygon points="50,420 30,395 70,395" fill="#ffffff" />
  </g>
</svg>
