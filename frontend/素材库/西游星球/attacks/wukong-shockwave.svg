<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <radialGradient id="shockRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="82%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="92%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#waveGlow)">
    <!-- 冲击波主扩散环 -->
    <circle cx="130" cy="130" r="115" fill="url(#shockRing)" />
    <!-- 内部金芒震荡圈 -->
    <circle cx="130" cy="130" r="85" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="16 10" opacity="0.85" />
    <circle cx="130" cy="130" r="50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />
    <!-- 8向冲击辐射金芒刺 -->
    <path d="M 130 15 L 130 45 M 130 215 L 130 245 M 15 130 L 45 130 M 215 130 L 245 130 M 48 48 L 70 70 M 190 190 L 212 212 M 48 212 L 70 190 M 212 48 L 190 70" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
