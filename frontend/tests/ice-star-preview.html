<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../src/"><title>冰冻星 · 动作检视</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e9f4de;color:#286247;font-family:system-ui,sans-serif}main{max-width:960px;margin:auto}h1{font-size:26px;margin:0 0 8px}p{margin:0 0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{font:inherit;min-height:44px;padding:8px 14px;border:1px solid #98b479;border-radius:12px;background:#fffdf4;color:#286247;cursor:pointer}button[aria-pressed=true]{background:#3e8058;color:white}button:focus-visible{outline:3px solid #4bafc6;outline-offset:3px}canvas{display:block;width:100%;border:2px solid #759d66;border-radius:16px}footer{margin-top:12px;font-size:14px}@media(max-width:500px){body{padding:12px}}</style>
<script src="./arcade/seed-cannon-art.js?v=20261014-assets1"></script><script src="./arcade/ice-star-art.js?v=20261014-assets1"></script>
<script src="./arcade/garden-tower-art.js?v=20261014-assets1"></script><script src="./arcade/garden-world-art.js?v=20261014-assets1"></script></head><body><main>
<h1>冰冻星 · 动作检视</h1><p>使用游戏实际塔体、雪球、怪物与冰面代码；伤害和减速沿用现有数值。</p>
<nav aria-label="检视控制"><button id="play" aria-pressed="true">连续攻击</button><button id="slow" aria-pressed="false">慢放</button><button id="boost" aria-pressed="false">超频</button><button id="moving" aria-pressed="false">移动目标</button><button id="release">查看出膛</button><button id="hit">查看命中碎片</button><button id="ground">查看冰面</button><button id="fade">查看融化</button><button id="save">保存当前画面</button></nav>
<canvas id="stage" width="960" height="580" role="img" aria-label="冰冻星三个等级的攻击和素材效果"></canvas><footer id="status" aria-live="polite">正在载入…</footer>
</main><script>
(async()=>{
 const source=(await(await fetch('./core-breach-legacy.html')).text()).match(/<script>([\s\S]*?)<\/script>/)[1];
 const {Tower,Enemy,Game}=new Function(source+';return {Tower:DefensiveTower,Enemy:CreepEnemy,Game:QuantumTDGame};')();
 const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),art=window.IceStarArt;
 const game={offsetX:64,offsetY:112,cellSize:64,scaleRatio:1.28,enemies:[],towers:[],projectiles:[],particles:[],icePatches:[],floatTexts:[],flyingCoins:[],energy:0,score:0,kills:0,totalDamage:0,
  getStageBaseHp(){return 10000},updateHUD(){},createParticleBurst:Game.prototype.createParticleBurst,createFloatingText:Game.prototype.createFloatingText};
 let playing=true,slow=false,boost=false,moving=false,last=0,time=0;
 function reset(){time=0;for(const name of ['enemies','towers','projectiles','particles','icePatches','floatTexts','flyingCoins'])game[name]=[];
  for(let i=0;i<3;i++){const tower=new Tower(0,i*2,'cryo',game);tower.level=i+1;tower.overdriveTimer=boost?100:0;game.towers.push(tower);
   const enemy=new Enemy('crawler',1,[{x:310,y:tower.y},{x:240,y:tower.y}],game);enemy.lateralOffset=0;enemy.walkCycle=0;enemy.speed=moving?25:0;enemy.hp=enemy.maxHp=10000;game.enemies.push(enemy);}
 }
 function update(dt){time+=dt;
  game.towers.forEach((tower,i)=>{const all=game.enemies;game.enemies=[all[i]];tower.update(dt,game);game.enemies=all;});
  game.enemies.forEach(e=>{e.iceSlowFactor=game.icePatches.reduce((factor,p)=>p.contains(e.x,e.y)?Math.max(.2,factor*p.slowFactor):factor,1);e.update(dt,game);if(e.reachedEnd){e.reachedEnd=false;e.currentWpIndex=0;e.x=310;e.distanceTraveled=0;}});
  game.projectiles.forEach(p=>p.update(dt,game));game.projectiles=game.projectiles.filter(p=>!p.destroyed);
  game.particles.forEach(p=>p.update(dt));game.particles=game.particles.filter(p=>p.life>0);
  game.icePatches.forEach(p=>{p.age+=dt;p.life-=dt;});game.icePatches=game.icePatches.filter(p=>p.life>0);
  game.floatTexts.forEach(p=>p.update(dt));game.floatTexts=game.floatTexts.filter(p=>p.life>0);
  if(time>12)reset();
 }
 function draw(){ctx.clearRect(0,0,960,580);ctx.fillStyle='#edf5dd';ctx.fillRect(0,0,960,580);
  for(let x=0;x<440;x+=64)for(let y=0;y<580;y+=64){ctx.fillStyle=(x/64+y/64)%2?'#b8d78d':'#b1d285';ctx.fillRect(x,y,64,64);}
  game.towers.forEach((t,i)=>{ctx.fillStyle='#f1dbaa';ctx.fillRect(252,t.y-32,100,64);ctx.font='bold 18px system-ui';ctx.fillStyle='#286247';ctx.fillText('Lv.'+(i+1),64,t.y-45);});
  game.icePatches.forEach((p,i)=>{if(!game.icePatches.some((q,j)=>j>i&&Math.hypot(q.x-p.x,q.y-p.y)<1))p.draw(ctx);});
  game.towers.forEach(t=>t.draw(ctx,game));game.enemies.forEach(e=>e.draw(ctx,game));game.projectiles.forEach(p=>p.draw(ctx));game.particles.forEach(p=>p.draw(ctx));
  ctx.fillStyle='#286247';ctx.font='bold 22px system-ui';ctx.fillText('三级冰冻星 · 实际攻击',24,38);ctx.fillText('命中素材分解',476,38);
  const tiles=[['snowball','雪白雪球',540,125,60],['trail','雪粒霜迹',690,125,96],['contact','接触闪光',840,125,60],['iceA','冰晶碎片',540,260,58],['leafA','霜叶碎片',690,260,54],['snowB','雪粒',840,260,36]];
  tiles.forEach(([name,label,x,y,size])=>{art.drawEffect(ctx,name,x,y,size,name==='trail'?36:size);ctx.font='16px system-ui';ctx.fillStyle='#286247';ctx.textAlign='center';ctx.fillText(label,x,y+58);});
  art.drawEffect(ctx,'patchBirth',540,444,115,115);art.drawEffect(ctx,'patchActive',690,444,145,145);art.drawEffect(ctx,'patchFade',840,444,145,145);
  ctx.font='16px system-ui';ctx.textAlign='center';['扩散','停留','融化'].forEach((text,i)=>ctx.fillText(text,540+i*150,544));ctx.textAlign='left';
 }
 function setPlaying(value){playing=value;document.getElementById('play').setAttribute('aria-pressed',String(value));document.getElementById('play').textContent=value?'连续攻击':'已暂停';}
 document.getElementById('play').onclick=()=>setPlaying(!playing);
 for(const id of ['slow','boost','moving'])document.getElementById(id).onclick=()=>{if(id==='slow')slow=!slow;else if(id==='boost'){boost=!boost;reset();}else{moving=!moving;reset();}document.getElementById(id).setAttribute('aria-pressed',String(id==='slow'?slow:id==='boost'?boost:moving));};
 document.getElementById('release').onclick=()=>{reset();game.towers.forEach((tower,i)=>{tower.targetEnemy=game.enemies[i];tower.fire(game);tower.cryoSpriteElapsed=120;tower.cryoSpriteState='release';});game.projectiles.forEach(p=>p.update(.18,game));setPlaying(false);draw();};
 for(const id of ['hit','ground','fade'])document.getElementById(id).onclick=()=>{reset();game.towers.forEach((tower,i)=>{tower.targetEnemy=game.enemies[i];tower.fire(game);});game.projectiles.forEach(p=>p.update(1,game));game.projectiles=[];game.enemies.forEach(e=>{e.iceSlowFactor=game.icePatches.reduce((factor,p)=>p.contains(e.x,e.y)?Math.max(.2,factor*p.slowFactor):factor,1);e.update(id==='hit'?.24:.6,game);});game.particles.forEach(p=>p.update(id==='hit'?.24:.6));game.icePatches.forEach(p=>{p.age=.4;if(id==='fade')p.life=.25;});setPlaying(false);draw();};
 document.getElementById('save').onclick=async()=>{draw();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const response=await fetch('/__ice_preview_export__',{method:'POST',body:blob});document.getElementById('status').textContent=response.ok?'画面已保存至 frontend/素材库/花园防线/制作记录/ice-star-v1/combat-preview.png':'保存失败';};
 reset();function frame(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;if(playing)update(dt*(slow?.25:1));draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
 document.getElementById('status').textContent='素材已载入。可慢放观察蓄冷、弹射、回弹，或单独查看命中碎片和冰面。';
})();
</script></body></html>
