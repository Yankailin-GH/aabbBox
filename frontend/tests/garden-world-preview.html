<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../src/"><title>花园防线 · 怪物与战场检视</title><style>body{margin:0;padding:20px;background:#e9f2d7;color:#315e42;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto}h1{font-size:25px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{font:inherit;min-height:44px;padding:8px 16px;border:1px solid #adc784;border-radius:14px;background:#fffbed;color:#315e42;cursor:pointer}button[aria-pressed=true]{background:#3e8058;color:white}button:focus-visible{outline:3px solid #e9b964}canvas{width:100%;display:block;border-radius:18px;border:1px solid #adc784}</style><script src="./arcade/seed-cannon-art.js?v=20261014-assets1"></script><script src="./arcade/ice-star-art.js?v=20261014-assets1"></script><script src="./arcade/garden-tower-art.js?v=20261014-assets1"></script><script src="./arcade/garden-world-art.js?v=20261014-assets1"></script></head><body><main><h1>花园防线 · 怪物与战场检视</h1><p>8种怪物四姿态、3张正式地图，使用游戏实际绘制代码与当前中文命名。</p><nav><button id="idle" aria-pressed="true">待机</button><button id="walk" aria-pressed="false">行走</button><button id="hit" aria-pressed="false">受击</button><button id="save">保存画面</button></nav><canvas id="poster" width="1200" height="1040" role="img" aria-label="八种怪物与三张花园地图的游戏实际绘制画面"></canvas><p id="status" aria-live="polite">正在载入…</p></main><script>
(async()=>{
 const html=await(await fetch('./core-breach-legacy.html')).text(),source=html.match(/<script>([\s\S]*?)<\/script>/)[1];
 const {Enemy,Tower,Game,maps,enemyTypes}=new Function(source+';return {Enemy:CreepEnemy,Tower:DefensiveTower,Game:QuantumTDGame,maps:MAP_DEFINITIONS,enemyTypes:ENEMY_TYPES};')();
 const canvas=document.getElementById('poster'),ctx=canvas.getContext('2d'),art=window.GardenWorldArt;let pose='idle',cycle=0;
 const types=Object.keys(enemyTypes),games=[];
 maps.slice(0,3).forEach((map,index)=>{
  const board=document.createElement('canvas');board.width=350;board.height=600;
  const game=Object.create(Game.prototype);Object.assign(game,{ctx:board.getContext('2d'),canvas:board,currentMapIndex:index,viewWidth:350,viewHeight:600,gridWidth:7,gridHeight:12,cellSize:50,offsetX:0,offsetY:0,time:0,screenShake:0,hp:20,maxHp:20,energy:400,maxTowers:map.maxTowers,
   towers:[],enemies:[],particles:[],projectiles:[],icePatches:[],groundZones:[],mines:[],flyingCoins:[],floatTexts:[],buildEffects:[],hoverGrid:{x:-1,y:-1},pathTiles:new Set()});
  game.routes=map.paths.map(path=>path.map(wp=>({x:(wp.x+.5)*50,y:(wp.y+.5)*50,gx:wp.x,gy:wp.y})));game.waypoints=game.routes[0];
  map.paths.forEach(path=>{for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],steps=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);for(let j=0;j<=steps;j++)game.pathTiles.add(`${a.x+Math.sign(b.x-a.x)*j},${a.y+Math.sign(b.y-a.y)*j}`);}});
  const goals=[[0,3],[4,4],[2,5],[6,7],[2,8]],towerTypes=['pulse','cryo','tesla','plasma','buffer'];
  goals.forEach(([gx,gy],i)=>{if(game.pathTiles.has(`${gx},${gy}`)){gx=[0,2,4,6].find(x=>!game.pathTiles.has(`${x},${gy}`)&&!game.towers.some(t=>t.gx===x&&t.gy===gy));}if(gx==null)return;const tower=new Tower(gx,gy,towerTypes[i],game);tower.level=3;game.towers.push(tower);});
  game.routes.forEach((route,i)=>{const e=new Enemy(types[(index*3+i)%types.length],1,route,game),at=route[Math.min(2,route.length-1)];e.x=at.x;e.y=at.y;e.lateralOffset=0;e.stealthRevealed=100;e.hp=e.maxHp*.72;game.enemies.push(e);});games.push(game);
 });
 function draw(){ctx.fillStyle='#fffbed';ctx.fillRect(0,0,1200,1040);ctx.fillStyle='#315e42';ctx.font='bold 32px system-ui';ctx.fillText('花园防线 · 圆润植物守卫与小方军团',28,49);ctx.font='18px system-ui';ctx.fillText('草皮与暖石花径 · 三级塔体 · 原地图路线与碰撞规则',28,84);
  types.forEach((type,i)=>{const x=75+i*150;ctx.save();ctx.translate(x,179);art.drawEnemy(ctx,type,pose==='walk'?(Math.sin(cycle)<0?'walkLeft':'walkRight'):pose,enemyTypes[type].isBoss?32:25);ctx.restore();ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillStyle='#315e42';ctx.fillText(enemyTypes[type].name,x,263);ctx.font='14px system-ui';ctx.fillStyle='#6b805a';ctx.fillText(enemyTypes[type].isBoss?'首领':'普通怪物',x,288);});ctx.textAlign='left';
  games.forEach((game,i)=>{game.enemies.forEach(e=>{e.walkCycle=pose==='walk'?cycle:0;e.speed=pose==='walk'?e.config.speed*.7:0;e.gardenPoseHitTime=pose==='hit'?.14:0;});game.render();ctx.fillStyle='#315e42';ctx.font='bold 22px system-ui';ctx.fillText(maps[i].name,30+i*400,336);ctx.drawImage(game.canvas,30+i*400,360);ctx.font='16px system-ui';ctx.fillText(`${maps[i].paths.length}条路线 · 最多${maps[i].maxTowers}座塔`,30+i*400,991);});
  ctx.font='16px system-ui';ctx.fillStyle='#6b805a';ctx.fillText('全部角色与地面为已接入游戏的素材；地图由实际 Game.render 绘制。',28,1024);
 }
 for(const id of ['idle','walk','hit'])document.getElementById(id).onclick=()=>{pose=id;document.querySelectorAll('nav [aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',String(b.id===id)));draw();};
 document.getElementById('save').onclick=async()=>{draw();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));const r=await fetch('/__garden_world_export__',{method:'POST',body:blob});document.getElementById('status').textContent=r.ok?'已保存 离线素材库/花园防线/制作记录/garden-world-v1/world-preview.png':'保存失败';};
 function frame(){cycle+=.045;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);document.getElementById('status').textContent='已载入8种怪物与3张正式地图。';
})();
</script></body></html>
