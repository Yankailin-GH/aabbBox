<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="theme-color" content="#dff4f1">
  <title>果果拼拼乐</title>
  <style>
    :root{--leaf:#2f7d4a;--leaf-dark:#24583e;--tomato:#e94f37;--mango:#f6c453;--berry:#6c4ab6;--water:#dff4f1;--ink:#24332c;--paper:#f8fff9;color-scheme:light;font-family:"Nunito","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#a7d2c6;color:var(--ink)}button{font:inherit;letter-spacing:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible,canvas:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
    .game-shell{position:relative;width:100%;height:100dvh;max-width:540px;min-height:520px;margin:0 auto;overflow:hidden;background:var(--water);isolation:isolate}.game-shell::before{content:"";position:absolute;inset:0;z-index:-3;background:linear-gradient(180deg,#dff4f1 0%,#effaf0 51%,#f8e1b7 51%,#edc58d 100%)}.game-shell::after{content:"";position:absolute;z-index:-2;left:-8%;right:-8%;top:48%;height:28px;border-radius:50%;background:rgba(255,255,255,.42);box-shadow:0 7px 18px rgba(84,123,99,.12)}
    .game-bar{height:calc(72px + env(safe-area-inset-top));padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:12px}.icon-button{width:52px;height:52px;display:grid;place-items:center;border:2px solid rgba(36,88,62,.15);border-radius:50%;background:rgba(255,255,255,.84);color:var(--leaf-dark);box-shadow:0 5px 0 rgba(47,125,74,.14);cursor:pointer;transition:filter .18s ease-out,box-shadow .18s ease-out}.icon-button:active{filter:brightness(.94);box-shadow:0 2px 0 rgba(47,125,74,.14)}.icon-button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.icon-button.is-muted .sound-wave{opacity:.2}
    .level-progress{min-width:0;display:grid;gap:7px;justify-items:center}.level-label{margin:0;color:var(--leaf-dark);font-size:14px;font-weight:900}.sprout-track{width:min(100%,210px);height:13px;display:grid;grid-template-columns:repeat(12,1fr);align-items:end;gap:3px}.sprout{position:relative;height:8px;border-radius:50% 50% 48% 48%;background:rgba(47,125,74,.2);transform-origin:bottom center}.sprout.is-grown{background:var(--leaf)}.sprout.is-current{height:13px;background:var(--mango);box-shadow:0 0 0 3px rgba(246,196,83,.25)}

    .canvas-wrap{position:relative;min-height:0;overflow:hidden;touch-action:none}#gameCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#gameCanvas.is-dragging{cursor:grabbing}.phase-prompt{position:absolute;z-index:5;left:50%;bottom:18px;min-width:170px;min-height:48px;padding:10px 20px;display:grid;place-items:center;transform:translateX(-50%);border:0;border-radius:24px;background:var(--leaf-dark);color:#fff;box-shadow:0 6px 0 rgba(22,65,43,.2);font-size:16px;font-weight:900;white-space:nowrap;cursor:pointer;transition:opacity .18s ease-out,filter .18s ease-out}.phase-prompt:active{filter:brightness(.9)}.phase-prompt[hidden]{display:none}

    .success-sheet{position:absolute;z-index:20;inset:auto 0 0;padding:23px 22px calc(22px + env(safe-area-inset-bottom));background:rgba(248,255,249,.97);border-top:3px solid rgba(47,125,74,.15);box-shadow:0 -18px 45px rgba(37,88,62,.18);text-align:center;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}.success-sheet.is-open{transform:translateY(0)}.success-kicker{margin:0 0 3px;color:var(--leaf);font-size:13px;font-weight:900}.success-sheet h2{margin:0;font-family:"YouYuan","STYuanti-SC","Noto Sans SC",sans-serif;font-size:30px;letter-spacing:0}.success-sheet p{margin:7px 0 16px;color:#52655b;font-size:14px;font-weight:700}.next-button{width:100%;min-height:56px;border:0;border-radius:8px;background:var(--mango);color:#293327;box-shadow:0 6px 0 #c99432;font-size:18px;font-weight:1000;cursor:pointer}.next-button:active{filter:brightness(.95);box-shadow:0 3px 0 #c99432}

    @media(min-width:700px){.game-shell{box-shadow:0 0 70px rgba(30,80,60,.28)}}
    @media(orientation:landscape) and (max-height:560px){.game-shell{max-width:430px;min-height:100%}.game-bar{height:60px;padding-top:8px}.play-area{height:calc(100% - 60px)}.word-panel{min-height:56px}.fruit-name{font-size:28px}.piece-status{min-height:46px;padding-bottom:8px}.portrait-note{position:absolute;z-index:30;right:8px;bottom:8px;display:block;margin:0;padding:5px 8px;border-radius:4px;background:rgba(36,51,44,.72);color:#fff;font-size:11px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="game-shell" aria-label="果果拼拼乐">
    <header class="game-bar">
      <button id="soundButton" class="icon-button" type="button" aria-label="关闭声音" title="声音">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 8.5H3v7h3.5L11 19V5Z"></path><path class="sound-wave" d="M15 9a4 4 0 0 1 0 6M17.8 6.2a8 8 0 0 1 0 11.6"></path></svg>
      </button>
      <div class="level-progress" aria-label="关卡进度"><p id="levelLabel" class="level-label">第 1 个，共 12 个</p><div id="sproutTrack" class="sprout-track" aria-hidden="true"></div></div>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.68"></path><path d="M20 4v4.68h-4.68"></path><path d="M10.8 9.2 15 12l-4.2 2.8V9.2Z"></path></svg>
      </button>
    </header>
    <section class="play-area">
      <div class="word-panel"><p id="kindLabel" class="kind-label">水果</p><h1 id="fruitName" class="fruit-name">苹果</h1></div>

        <button id="phasePrompt" class="phase-prompt" type="button">点点苹果</button>
      </div>
      <div class="piece-status" aria-hidden="true"><p id="statusText">听听它叫什么</p><div id="pieceDots" class="piece-dots"></div></div>
    </section>
    <section id="successSheet" class="success-sheet" aria-labelledby="successTitle" aria-hidden="true" inert>
      <p class="success-kicker">收藏花园长出新叶子</p><h2 id="successTitle">苹果拼好啦</h2><p id="successCopy">你认识了苹果</p><button id="nextButton" class="next-button" type="button">认识下一个</button>
    </section>
    <p class="portrait-note">竖屏体验更完整</p><p id="liveRegion" class="live-region" aria-live="polite"></p>
  </main>
  <script>
  (()=>{
    "use strict";
    const TAU=Math.PI*2,SAVE_KEY="aabb-fruit-puzzle-progress-v1",reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const $=id=>document.getElementById(id),canvas=$("gameCanvas"),ctx=canvas.getContext("2d",{alpha:true}),canvasWrap=$("canvasWrap"),soundButton=$("soundButton"),replayButton=$("replayButton"),phasePrompt=$("phasePrompt"),nextButton=$("nextButton"),successSheet=$("successSheet"),fruitName=$("fruitName"),kindLabel=$("kindLabel"),levelLabel=$("levelLabel"),statusText=$("statusText"),pieceDots=$("pieceDots"),sproutTrack=$("sproutTrack"),liveRegion=$("liveRegion");
    const items=[
      {id:"apple",name:"苹果",kind:"水果",pieces:2,bounds:[66,37,228,278],draw:drawApple},
      {id:"orange",name:"橙子",kind:"水果",pieces:2,bounds:[62,54,236,242],draw:drawOrange},
      {id:"watermelon",name:"西瓜",kind:"水果",pieces:3,bounds:[50,62,260,242],draw:drawWatermelon},
      {id:"pear",name:"梨",kind:"水果",pieces:3,bounds:[75,28,210,300],draw:drawPear},
      {id:"strawberry",name:"草莓",kind:"水果",pieces:4,bounds:[72,33,216,294],draw:drawStrawberry},
      {id:"tomato",name:"番茄",kind:"蔬菜",pieces:4,bounds:[58,57,244,246],draw:drawTomato},
      {id:"carrot",name:"胡萝卜",kind:"蔬菜",pieces:4,bounds:[88,8,184,344],draw:drawCarrot},
      {id:"cucumber",name:"黄瓜",kind:"蔬菜",pieces:5,bounds:[82,24,196,318],draw:drawCucumber},
      {id:"corn",name:"玉米",kind:"蔬菜",pieces:5,bounds:[76,14,208,334],draw:drawCorn},
      {id:"banana",name:"香蕉",kind:"水果",pieces:5,bounds:[32,64,296,226],draw:drawBanana},
      {id:"eggplant",name:"茄子",kind:"蔬菜",pieces:6,bounds:[66,28,238,307],draw:drawEggplant},
      {id:"kiwi",name:"猕猴桃",kind:"水果",pieces:6,bounds:[56,51,248,254],draw:drawKiwi}
    ];
    let saved=loadProgress(),index=clamp(saved.index,0,items.length-1),item=items[index],state="waiting",width=0,height=0,dpr=1,target={x:0,y:0,size:0,scale:1},sourceCanvas=null,sourceCtx=null,pieces=[],selected=null,dragOffset={x:0,y:0},pointerStart={x:0,y:0},cuttingStart=0,cutDuration=0,cutLines=[],particles=[],lastTime=0,audioContext=null,soundEnabled=true,resizeFrame=0;

    function loadProgress(){try{const p=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");return{index:Number.isInteger(p.index)?p.index:0,unlocked:Array.isArray(p.unlocked)?p.unlocked:[]}}catch(e){return{index:0,unlocked:[]}}}
    function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(saved))}catch(e){}}
    function buildProgress(){sproutTrack.innerHTML="";items.forEach((entry,i)=>{const node=document.createElement("span");node.className="sprout"+(saved.unlocked.includes(entry.id)?" is-grown":"")+(i===index?" is-current":"");sproutTrack.appendChild(node)})}
    function setLive(message){liveRegion.textContent="";setTimeout(()=>{liveRegion.textContent=message},20)}
    function setPrompt(text,visible=true){phasePrompt.textContent=text;phasePrompt.hidden=!visible}
    function updateText(){fruitName.textContent=item.name;kindLabel.textContent=item.kind;levelLabel.textContent=`第 ${index+1} 个，共 ${items.length} 个`;canvas.setAttribute("aria-label",`${item.name}拼图，按回车可以自动放好下一块`);buildProgress()}
    function prepareItem(autoStart=false){
      item=items[index];state=autoStart?"showcase":"waiting";pieces=[];particles=[];selected=null;successSheet.classList.remove("is-open");successSheet.setAttribute("aria-hidden","true");successSheet.inert=true;updateText();createSource();layout();statusText.textContent=autoStart?`这是${item.name}`:"听听它叫什么";pieceDots.innerHTML="";setPrompt(autoStart?"听一听":`点点${item.name}`,!autoStart);
      if(autoStart){speak(`这是${item.name}，${item.name}。`);setLive(`这是${item.name}`);setTimeout(()=>{if(state!=="showcase")return;state="cut-ready";statusText.textContent="把它轻轻切开";setPrompt("滑一滑，切开它",true)},reduceMotion?350:1450)}
    }
    function startLearning(){ensureAudio();state="showcase";setPrompt("听一听",false);statusText.textContent=`这是${item.name}`;speak(`这是${item.name}，${item.name}。`);setLive(`这是${item.name}`);tone(520,.09,"sine",.025,720);setTimeout(()=>{if(state!=="showcase")return;state="cut-ready";statusText.textContent="把它轻轻切开";setPrompt("滑一滑，切开它",true)},reduceMotion?350:1450)}
    function beginCut(){
      if(state!=="cut-ready")return;ensureAudio();state="cutting";setPrompt("正在切开",false);statusText.textContent="嚓，嚓，嚓";cuttingStart=performance.now();cutDuration=reduceMotion?120:Math.max(620,item.pieces*190);cutLines=Array.from({length:item.pieces-1},(_,i)=>(i+1)/item.pieces);tone(260,.08,"triangle",.018,410);
      setTimeout(()=>{if(state!=="cutting")return;createPieces();state="puzzle";statusText.textContent="把每一块送回去";setLive(`${item.name}分成了${item.pieces}块，请把它拼完整`);renderDots()},cutDuration+60)
    }
    function createSource(){sourceCanvas=document.createElement("canvas");sourceCanvas.width=360;sourceCanvas.height=360;sourceCtx=sourceCanvas.getContext("2d");sourceCtx.clearRect(0,0,360,360);item.draw(sourceCtx)}
    function createPieces(){const[bx,by,bw,bh]=item.bounds;pieces=[];for(let i=0;i<item.pieces;i++){const sy=Math.round(by+bh*i/item.pieces),ey=Math.round(by+bh*(i+1)/item.pieces);pieces.push({i,sx:bx,sy,sw:bw,sh:ey-sy,x:0,y:0,homeX:0,homeY:0,targetX:0,targetY:0,placed:false,returning:false})}layoutPieces()}
    function layout(){
      const rect=canvasWrap.getBoundingClientRect();width=Math.max(1,rect.width);height=Math.max(1,rect.height);dpr=Math.min(2,Math.max(1,window.devicePixelRatio||1));canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=`${width}px`;canvas.style.height=`${height}px`;ctx.setTransform(dpr,0,0,dpr,0,0);const size=Math.min(width*.73,height*.48,292);target.size=size;target.scale=size/360;target.x=(width-size)/2;target.y=Math.max(8,Math.min(48,height*.08));if(pieces.length)layoutPieces()
    }
    function layoutPieces(){
      const[bx]=item.bounds,s=target.scale,trayTop=Math.min(height-target.size*.32,target.y+target.size+18),usable=Math.max(90,height-trayTop-18);
      pieces.forEach((piece,i)=>{piece.targetX=target.x+piece.sx*s;piece.targetY=target.y+piece.sy*s;if(piece.placed){piece.x=piece.targetX;piece.y=piece.targetY;return}const side=i%2===0?-1:1,spread=Math.min(width*.19,72),baseX=width/2-piece.sw*s/2+side*spread+(i%3-1)*6,baseY=trayTop+(i+.35)*usable/pieces.length-piece.sh*s/2;piece.x=clamp(baseX,-bx*s*.25,width-piece.sw*s+bx*s*.25);piece.y=clamp(baseY,trayTop-10,height-piece.sh*s-4);piece.homeX=piece.x;piece.homeY=piece.y;piece.returning=false})
    }
    function renderDots(){pieceDots.innerHTML="";pieces.forEach(piece=>{const dot=document.createElement("span");dot.className="piece-dot"+(piece.placed?" is-placed":"");pieceDots.appendChild(dot)})}
    function pointerPosition(e){const rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
    function findPieceAt(point){const s=target.scale;for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];if(p.placed)continue;const lx=(point.x-p.x)/s,ly=(point.y-p.y)/s;if(lx<0||ly<0||lx>=p.sw||ly>=p.sh)continue;const alpha=sourceCtx.getImageData(Math.floor(p.sx+lx),Math.floor(p.sy+ly),1,1).data[3];if(alpha>22)return p}return null}
    function onPointerDown(e){
      const point=pointerPosition(e);pointerStart=point;if(state==="waiting"){startLearning();return}if(state==="showcase"){state="cut-ready";statusText.textContent="把它轻轻切开";setPrompt("滑一滑，切开它",true);return}if(state==="cut-ready"){canvas.setPointerCapture?.(e.pointerId);selected={cutGesture:true};return}if(state!=="puzzle")return;const piece=findPieceAt(point);if(!piece)return;ensureAudio();selected=piece;piece.returning=false;dragOffset.x=point.x-piece.x;dragOffset.y=point.y-piece.y;const at=pieces.indexOf(piece);pieces.splice(at,1);pieces.push(piece);canvas.classList.add("is-dragging");canvas.setPointerCapture?.(e.pointerId)
    }

    }

    function completeLevel(){

    }
    function nextLevel(){index=index===items.length-1?0:index+1;saved.index=index;saveProgress();prepareItem(true)}
    function makeCelebration(){const colors=["#2f7d4a","#f6c453","#e94f37","#6c4ab6","#fff"];for(let i=0;i<52;i++)particles.push({x:width/2,y:target.y+target.size*.5,vx:(Math.random()-.5)*230,vy:-80-Math.random()*210,g:260,size:4+Math.random()*7,color:colors[i%colors.length],life:1.2+Math.random()*.7,angle:Math.random()*TAU,spin:(Math.random()-.5)*9})}

    function tone(from,duration,type="sine",volume=.02,to=from){if(!soundEnabled||!audioContext)return;const now=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.setValueAtTime(from,now);osc.frequency.exponentialRampToValueAtTime(Math.max(1,to),now+duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(audioContext.destination);osc.start(now);osc.stop(now+duration+.03)}
    function speak(text){if(!soundEnabled||!("speechSynthesis" in window))return;speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="zh-CN";utterance.rate=.78;utterance.pitch=1.08;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("zh"));if(voice)utterance.voice=voice;speechSynthesis.speak(utterance)}

    function update(dt){

      for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;if(p.life<=0)particles.splice(i,1)}
    }
    function draw(time){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);drawBoard();if(state==="puzzle"||state==="complete")drawPuzzle();else drawWhole(time);drawParticles()}
    function drawBoard(){
      const top=Math.max(2,target.y-10),bottom=Math.min(height-8,target.y+target.size+18);roundedRect(ctx,18,top,width-36,bottom-top,24);const wood=ctx.createLinearGradient(0,top,0,bottom);wood.addColorStop(0,"#f1c990");wood.addColorStop(1,"#dda568");ctx.fillStyle=wood;ctx.fill();ctx.strokeStyle="rgba(142,86,42,.24)";ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.clip();ctx.strokeStyle="rgba(132,79,40,.12)";ctx.lineWidth=1.5;for(let y=top+20;y<bottom;y+=25){ctx.beginPath();ctx.moveTo(28,y);ctx.bezierCurveTo(width*.3,y-7,width*.7,y+7,width-28,y-2);ctx.stroke()}ctx.restore()
    }
    function drawWhole(time){
      const pulse=state==="waiting"&&!reduceMotion?1+Math.sin(time*.004)*.018:1;ctx.save();ctx.translate(target.x+target.size/2,target.y+target.size/2);ctx.scale(pulse,pulse);ctx.translate(-target.size/2,-target.size/2);ctx.shadowColor="rgba(36,88,62,.22)";ctx.shadowBlur=18;ctx.shadowOffsetY=8;ctx.drawImage(sourceCanvas,0,0,360,360,0,0,target.size,target.size);ctx.restore();if(state==="cut-ready"||state==="cutting")drawCutGuide(time)
    }
    function drawCutGuide(time){
      const[bx,by,bw,bh]=item.bounds,s=target.scale;ctx.save();ctx.setLineDash([8,8]);ctx.lineWidth=3;ctx.strokeStyle="rgba(255,255,255,.92)";ctx.shadowColor="rgba(36,51,44,.25)";ctx.shadowBlur=4;cutLines.length||(cutLines=Array.from({length:item.pieces-1},(_,i)=>(i+1)/item.pieces));cutLines.forEach(ratio=>{const y=target.y+(by+bh*ratio)*s;ctx.beginPath();ctx.moveTo(target.x+(bx+5)*s,y);ctx.lineTo(target.x+(bx+bw-5)*s,y);ctx.stroke()});ctx.setLineDash([]);let progress=0,lineIndex=0;if(state==="cutting"){const all=clamp((time-cuttingStart)/cutDuration,0,.9999)*cutLines.length;lineIndex=Math.floor(all);progress=all-lineIndex}else progress=.12+.76*(.5+.5*Math.sin(time*.003));const y=target.y+(by+bh*cutLines[Math.min(lineIndex,cutLines.length-1)])*s,x=target.x+(bx+bw*(.08+.84*progress))*s;drawToyCutter(x,y,state==="cutting"?.02:Math.sin(time*.002)*.06);ctx.restore()
    }
    function drawToyCutter(x,y,angle){ctx.save();ctx.translate(x,y-12);ctx.rotate(angle);ctx.shadowColor="rgba(36,51,44,.25)";ctx.shadowBlur=6;ctx.fillStyle="rgba(235,250,246,.96)";roundedRect(ctx,-6,-4,52,18,7);ctx.fill();ctx.strokeStyle="#4c7c70";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#e94f37";roundedRect(ctx,-34,-9,34,28,12);ctx.fill();ctx.fillStyle="#f6c453";ctx.beginPath();ctx.arc(-19,5,4,0,TAU);ctx.fill();ctx.restore()}
    function drawPuzzle(){ctx.save();ctx.globalAlpha=.13;ctx.filter="grayscale(1)";ctx.drawImage(sourceCanvas,0,0,360,360,target.x,target.y,target.size,target.size);ctx.restore();const s=target.scale;pieces.filter(p=>p.placed).forEach(p=>drawPiece(p,s,false));pieces.filter(p=>!p.placed).forEach(p=>drawPiece(p,s,true))}
    function drawPiece(p,s,shadow){ctx.save();if(shadow){ctx.shadowColor="rgba(36,51,44,.28)";ctx.shadowBlur=12;ctx.shadowOffsetY=6}ctx.drawImage(sourceCanvas,p.sx,p.sy,p.sw,p.sh,p.x,p.y,p.sw*s,p.sh*s);ctx.restore()}
    function drawParticles(){particles.forEach(p=>{ctx.save();ctx.globalAlpha=clamp(p.life,0,1);ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;roundedRect(ctx,-p.size/2,-p.size/3,p.size,p.size*.66,2);ctx.fill();ctx.restore()})}
    function frame(time){const dt=Math.min(.033,(time-lastTime)/1000||0);lastTime=time;update(dt);draw(time);requestAnimationFrame(frame)}

    function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
    function roundedRect(c,x,y,w,h,r){const radius=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+radius,y);c.arcTo(x+w,y,x+w,y+h,radius);c.arcTo(x+w,y+h,x,y+h,radius);c.arcTo(x,y+h,x,y,radius);c.arcTo(x,y,x+w,y,radius);c.closePath()}
    function ellipse(c,x,y,rx,ry,fill,rotation=0){c.save();c.translate(x,y);c.rotate(rotation);c.fillStyle=fill;c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.fill();c.restore()}
    function linear(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([n,color])=>g.addColorStop(n,color));return g}
    function radial(c,x0,y0,r0,x1,y1,r1,stops){const g=c.createRadialGradient(x0,y0,r0,x1,y1,r1);stops.forEach(([n,color])=>g.addColorStop(n,color));return g}
    function drawApple(c){c.save();c.strokeStyle="#6b452b";c.lineWidth=13;c.lineCap="round";c.beginPath();c.moveTo(183,72);c.quadraticCurveTo(177,48,190,34);c.stroke();ellipse(c,213,52,35,16,linear(c,180,40,240,65,[[0,"#66a84a"],[1,"#2f7d4a"]]),-.35);const g=radial(c,135,122,8,177,188,124,[[0,"#ff8a69"],[.46,"#ef4e38"],[1,"#a9252b"]]);c.fillStyle=g;c.beginPath();c.moveTo(180,91);c.bezierCurveTo(120,56,69,101,76,181);c.bezierCurveTo(81,252,133,304,180,292);c.bezierCurveTo(227,304,279,252,284,181);c.bezierCurveTo(291,101,240,56,180,91);c.fill();ellipse(c,126,139,22,48,"rgba(255,255,255,.2)",.25);c.restore()}

    function drawWatermelon(c){c.save();const g=linear(c,80,80,285,275,[[0,"#80c957"],[.5,"#3fa64e"],[1,"#237441"]]);ellipse(c,180,184,124,113,g,-.04);c.save();c.beginPath();c.ellipse(180,184,124,113,-.04,0,TAU);c.clip();c.strokeStyle="rgba(29,104,55,.62)";c.lineWidth=13;for(let x=74;x<=286;x+=34){c.beginPath();c.moveTo(x,71);c.bezierCurveTo(x-18,145,x+18,224,x,309);c.stroke()}c.restore();ellipse(c,137,126,19,42,"rgba(255,255,255,.14)",.6);c.strokeStyle="#6e472c";c.lineWidth=8;c.lineCap="round";c.beginPath();c.moveTo(187,76);c.quadraticCurveTo(202,49,227,54);c.stroke();c.restore()}
    function drawPear(c){c.save();c.strokeStyle="#72502e";c.lineWidth=11;c.lineCap="round";c.beginPath();c.moveTo(184,75);c.quadraticCurveTo(181,48,195,31);c.stroke();ellipse(c,215,49,31,14,"#4b9547",-.42);const g=radial(c,140,145,8,180,202,128,[[0,"#e5ef77"],[.5,"#acd153"],[1,"#659f3c"]]);c.fillStyle=g;c.beginPath();c.moveTo(180,76);c.bezierCurveTo(143,82,151,137,119,163);c.bezierCurveTo(66,206,87,299,180,318);c.bezierCurveTo(273,299,294,206,241,163);c.bezierCurveTo(209,137,217,82,180,76);c.fill();ellipse(c,139,172,16,48,"rgba(255,255,255,.18)",.35);c.restore()}
    function drawStrawberry(c){c.save();const g=linear(c,100,85,256,310,[[0,"#ff7458"],[.54,"#e93638"],[1,"#b91f33"]]);c.fillStyle=g;c.beginPath();c.moveTo(88,104);c.bezierCurveTo(101,66,145,70,180,92);c.bezierCurveTo(215,70,259,66,272,104);c.bezierCurveTo(285,167,249,269,180,319);c.bezierCurveTo(111,269,75,167,88,104);c.fill();c.fillStyle="#419743";for(let i=0;i<7;i++){c.save();c.translate(180,92);c.rotate(i*TAU/7);c.beginPath();c.ellipse(0,-28,12,39,0,0,TAU);c.fill();c.restore()}for(let r=0;r<5;r++)for(let i=0;i<5-r;i++){const x=125+i*(110/(5-r-1||1))+r*5,y=137+r*34;ellipse(c,x,y,3,6,"#ffd76b",.3)}ellipse(c,125,131,12,30,"rgba(255,255,255,.18)",.45);c.restore()}
    function drawTomato(c){c.save();const g=radial(c,132,128,10,180,191,122,[[0,"#ff7b5e"],[.5,"#ed4737"],[1,"#b5292d"]]);ellipse(c,180,192,118,105,g);ellipse(c,127,151,17,34,"rgba(255,255,255,.18)",.6);c.fillStyle="#388442";for(let i=0;i<7;i++){c.save();c.translate(180,93);c.rotate(i*TAU/7);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(9,25,8,54);c.lineTo(0,42);c.lineTo(-8,54);c.quadraticCurveTo(-9,25,0,0);c.fill();c.restore()}c.strokeStyle="#315f34";c.lineWidth=9;c.lineCap="round";c.beginPath();c.moveTo(180,93);c.lineTo(184,64);c.stroke();c.restore()}
    function drawCarrot(c){c.save();c.strokeStyle="#3d9149";c.lineWidth=18;c.lineCap="round";[[180,88,138,16],[180,88,181,8],[180,88,224,18],[180,88,157,34],[180,88,205,37]].forEach(v=>{c.beginPath();c.moveTo(v[0],v[1]);c.quadraticCurveTo(v[2],v[3]+36,v[2],v[3]);c.stroke()});const g=linear(c,124,91,229,336,[[0,"#ffad39"],[.5,"#f4782e"],[1,"#d94a27"]]);c.fillStyle=g;c.beginPath();c.moveTo(112,91);c.quadraticCurveTo(180,70,248,91);c.quadraticCurveTo(226,223,180,342);c.quadraticCurveTo(134,223,112,91);c.fill();c.strokeStyle="rgba(132,54,25,.35)";c.lineWidth=5;c.lineCap="round";[[139,159,167],[194,204,229],[146,252,177]].forEach(v=>{c.beginPath();c.moveTo(v[0],v[1]);c.lineTo(v[2],v[1]+2);c.stroke()});c.restore()}
    function drawCucumber(c){c.save();const g=linear(c,110,38,247,327,[[0,"#67bd54"],[.45,"#31984a"],[1,"#186c3c"]]);c.fillStyle=g;c.beginPath();c.moveTo(157,30);c.bezierCurveTo(114,34,105,76,112,133);c.lineTo(135,299);c.bezierCurveTo(142,345,218,344,229,300);c.lineTo(248,97);c.bezierCurveTo(253,46,214,20,157,30);c.fill();c.strokeStyle="rgba(190,235,106,.42)";c.lineWidth=6;c.beginPath();c.moveTo(153,48);c.bezierCurveTo(139,138,165,245,157,322);c.stroke();for(let i=0;i<32;i++){const x=132+(i*37%93),y=62+(i*61%245);ellipse(c,x,y,2.2,2.2,"rgba(220,244,130,.55)")}ellipse(c,180,38,50,13,"#86ca59");c.restore()}
    function drawCorn(c){c.save();const cob=linear(c,115,44,232,317,[[0,"#ffe27a"],[.5,"#f6c33f"],[1,"#e8962e"]]);roundedRect(c,112,38,136,282,67);c.fillStyle=cob;c.fill();c.strokeStyle="rgba(177,118,27,.32)";c.lineWidth=2;for(let y=66;y<304;y+=22){c.beginPath();c.moveTo(118,y);c.lineTo(242,y);c.stroke()}for(let x=129;x<246;x+=18){c.beginPath();c.moveTo(x,51);c.lineTo(x-8,309);c.stroke()}c.fillStyle="#3e9949";c.beginPath();c.moveTo(110,125);c.quadraticCurveTo(59,218,116,343);c.quadraticCurveTo(163,302,166,178);c.fill();c.beginPath();c.moveTo(248,111);c.quadraticCurveTo(304,208,238,344);c.quadraticCurveTo(196,290,194,174);c.fill();ellipse(c,147,79,13,34,"rgba(255,255,255,.18)",.3);c.restore()}
    function drawBanana(c){c.save();const g=linear(c,57,87,294,270,[[0,"#ffe06a"],[.5,"#f6c43f"],[1,"#dba12b"]]);c.fillStyle=g;c.beginPath();c.moveTo(62,86);c.bezierCurveTo(91,211,181,259,297,191);c.lineTo(315,226);c.bezierCurveTo(183,326,61,252,39,108);c.closePath();c.fill();c.strokeStyle="#9e7423";c.lineWidth=8;c.lineCap="round";c.beginPath();c.moveTo(54,101);c.lineTo(45,78);c.moveTo(301,201);c.lineTo(317,194);c.stroke();c.strokeStyle="rgba(137,93,25,.3)";c.lineWidth=3;c.beginPath();c.moveTo(62,117);c.bezierCurveTo(105,230,194,265,286,209);c.stroke();ellipse(c,94,154,9,30,"rgba(255,255,255,.16)",-.65);c.restore()}
    function drawEggplant(c){c.save();const g=radial(c,132,128,8,185,210,135,[[0,"#a77bd4"],[.42,"#7146a8"],[1,"#3d286f"]]);c.fillStyle=g;c.beginPath();c.moveTo(166,83);c.bezierCurveTo(87,113,69,193,100,271);c.bezierCurveTo(132,352,244,339,277,258);c.bezierCurveTo(308,181,258,110,194,82);c.closePath();c.fill();c.fillStyle="#3d9348";for(let i=0;i<6;i++){c.save();c.translate(181,83);c.rotate(i*TAU/6);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(13,25,8,56);c.lineTo(0,43);c.lineTo(-8,56);c.quadraticCurveTo(-13,25,0,0);c.fill();c.restore()}c.strokeStyle="#315f34";c.lineWidth=11;c.lineCap="round";c.beginPath();c.moveTo(181,75);c.quadraticCurveTo(177,46,198,31);c.stroke();ellipse(c,129,153,16,48,"rgba(255,255,255,.16)",.35);c.restore()}
    function drawKiwi(c){c.save();const skin=radial(c,132,122,8,180,181,124,[[0,"#c69458"],[.5,"#9b663c"],[1,"#67452e"]]);ellipse(c,180,183,119,121,skin,.02);c.strokeStyle="rgba(73,45,26,.28)";c.lineWidth=1.4;for(let i=0;i<110;i++){const a=i*2.3,r=22+(i%17)*5.2,x=180+Math.cos(a)*r,y=183+Math.sin(a)*r;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*4,y+Math.sin(a)*4);c.stroke()}ellipse(c,137,128,16,38,"rgba(255,255,255,.13)",.5);c.restore()}

    phasePrompt.addEventListener("click",()=>{if(state==="waiting")startLearning();else if(state==="cut-ready")beginCut()});soundButton.addEventListener("click",toggleSound);replayButton.addEventListener("click",()=>{ensureAudio();speak(`这是${item.name}，${item.name}。`);tone(560,.08,"sine",.018,760)});nextButton.addEventListener("click",nextLevel);canvas.addEventListener("pointerdown",onPointerDown);canvas.addEventListener("pointermove",onPointerMove);canvas.addEventListener("pointerup",onPointerUp);canvas.addEventListener("pointercancel",onPointerUp);canvas.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();placeNextPiece()}});window.addEventListener("resize",()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(layout)});document.addEventListener("visibilitychange",()=>{if(document.hidden&&"speechSynthesis" in window)speechSynthesis.cancel()});
    prepareItem(false);requestAnimationFrame(frame);
  })();
