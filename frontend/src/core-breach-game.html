  <style>

    function drawFrostBolt(b){ctx.save();ctx.strokeStyle='rgba(150,236,255,.42)';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<b.trail.length;i++){const p=b.trail[i];if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y)}ctx.lineTo(b.x,b.y);ctx.stroke();ctx.translate(b.x,b.y);ctx.rotate(G.time*7);ctx.shadowColor='#a6eeff';ctx.shadowBlur=11;ctx.fillStyle='#dcfbff';ctx.fillRect(-4,-4,8,8);ctx.restore()}
    function drawDrone(p,sub){for(let i=0;i<sub.count;i++){const a=G.time*2+i*Math.PI*2/sub.count,x=p.x+Math.cos(a)*21,y=p.y+Math.sin(a)*21;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.shadowColor='#9deaff';ctx.shadowBlur=10;ctx.fillStyle='#274d65';ctx.strokeStyle='#c8f6ff';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-6);ctx.lineTo(-3,0);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}
    function drawBeam(b){const a=clamp(b.life/b.maxLife,0,1),head=1-a;ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.globalAlpha=a*.34;ctx.strokeStyle=b.secondary?'#66d5e7':'#4a65ff';ctx.shadowColor='#5ac8ff';ctx.shadowBlur=18;ctx.lineWidth=b.width*3.4+7;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.globalAlpha=a*.82;ctx.strokeStyle='#68d7ff';ctx.lineWidth=b.width+3;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.globalAlpha=a;ctx.strokeStyle='#f4fdff';ctx.lineWidth=Math.max(2,b.width*.34);ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.shadowBlur=0;ctx.setLineDash([3,11]);ctx.lineDashOffset=-head*26-b.phase;ctx.strokeStyle='#d8f8ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
    function drawSlash(s){const a=clamp(s.life/s.maxLife,0,1),r=s.reach*(1-a*.13),arc=s.arc||.92;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*(s.echo?.7:1);ctx.lineCap='round';ctx.shadowColor='#ffd33d';ctx.shadowBlur=19;ctx.strokeStyle='#ff8a1f';ctx.lineWidth=15*a+5;ctx.beginPath();ctx.arc(0,0,r,-arc,arc);ctx.stroke();ctx.strokeStyle='#ffd83d';ctx.lineWidth=7*a+3;ctx.beginPath();ctx.arc(0,0,r+2,-arc,arc);ctx.stroke();ctx.strokeStyle='#fffdf0';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,r+3,-arc,arc);ctx.stroke();ctx.shadowBlur=0;ctx.setLineDash([8,7]);ctx.strokeStyle='#fff0a3';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,r+8,-arc*.97,arc*.97);ctx.stroke();ctx.setLineDash([]);for(const side of [-1,1]){const angle=side*arc;ctx.strokeStyle='#fff9d9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Math.cos(angle)*(r-6),Math.sin(angle)*(r-6));ctx.lineTo(Math.cos(angle)*(r+12),Math.sin(angle)*(r+12));ctx.stroke()}ctx.restore()}
    function drawDartSprite(x,y,angle,alpha,size){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(size,size);ctx.globalAlpha=alpha;ctx.fillStyle='#101a18';ctx.beginPath();ctx.moveTo(-7,-5);ctx.lineTo(11,0);ctx.lineTo(-7,6);ctx.lineTo(-2,0);ctx.closePath();ctx.fill();ctx.fillStyle='#e8edf5';ctx.beginPath();ctx.moveTo(-4,-2.8);ctx.lineTo(9,0);ctx.lineTo(-4,3.2);ctx.lineTo(0,0);ctx.closePath();ctx.fill();ctx.fillStyle='#101a18';ctx.beginPath();ctx.arc(-8,0,4.8,0,6.28);ctx.fill();ctx.fillStyle='#ff5d50';ctx.beginPath();ctx.arc(-8,0,2.3,0,6.28);ctx.fill();ctx.restore()}
    function drawBolt(b){ctx.save();if(b.kind==='dart'){b.trail.forEach((p,i)=>drawDartSprite(p.x,p.y,b.spin-(b.trail.length-i)*.18,(i+1)/b.trail.length*.16,b.size*.82));ctx.strokeStyle='rgba(214,236,255,.38)';ctx.lineWidth=1.5;ctx.beginPath();b.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(b.x,b.y);ctx.stroke();drawDartSprite(b.x,b.y,b.spin,1,b.size)}else{const a=Math.atan2(b.vy,b.vx);ctx.strokeStyle='rgba(255,183,92,.5)';ctx.lineWidth=2;ctx.beginPath();b.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(b.x,b.y);ctx.stroke();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.shadowColor='#ffac50';ctx.shadowBlur=8;ctx.fillStyle='#fff0bc';ctx.beginPath();ctx.roundRect(-8,-1.6,14,3.2,2);ctx.fill();ctx.fillStyle='#ff8a35';ctx.beginPath();ctx.moveTo(6,-2.5);ctx.lineTo(12,0);ctx.lineTo(6,2.5);ctx.closePath();ctx.fill()}ctx.restore()}function drawDrop(d){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(G.time*2);ctx.fillStyle=d.color;ctx.shadowColor=d.color;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,-d.r);ctx.lineTo(d.r,0);ctx.lineTo(0,d.r);ctx.lineTo(-d.r,0);ctx.closePath();ctx.fill();ctx.restore()}
    function loop(now){if(G.state!=='playing')return;const dt=Math.min(.034,(now-last)/1000||0);last=now;update(dt);draw();if(G.state==='playing')raf=requestAnimationFrame(loop)}
    function unlockAudio(){if(!audioOn)return;try{const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return;const ac=sound.ac||(sound.ac=new AudioCtor());if(ac.state==='suspended')ac.resume()}catch(e){}}
    function sound(freq,duration,type='sine',volume=.025,endFreq=freq,delay=0){if(!audioOn||sound.voices>=28)return;try{unlockAudio();const ac=sound.ac;if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),at=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),at+duration);g.gain.setValueAtTime(volume,at);g.gain.exponentialRampToValueAtTime(.001,at+duration);o.connect(g).connect(ac.destination);o.onended=()=>sound.voices=Math.max(0,sound.voices-1);o.start(at);o.stop(at+duration);sound.voices++}catch(e){}}
    sound.voices=0;
    function weaponAttackSound(kind){if(kind==='dart'){sound(820,.065,'triangle',.016,360)}else if(kind==='katana'){sound(1180,.13,'sawtooth',.012,220);sound(540,.09,'sine',.01,980,.02)}else if(kind==='ak47'){sound(145,.045,'square',.012,62);sound(860,.025,'triangle',.006,240)}else{sound(180,.13,'sawtooth',.018,780);sound(720,.09,'sine',.012,260,.018)}}
    function weaponHitSound(kind){const now=performance.now(),gate=kind==='ak47'?55:32;if(now-(weaponHitSound.last[kind]||0)<gate)return;weaponHitSound.last[kind]=now;if(kind==='dart'){sound(980,.035,'square',.011,610)}else if(kind==='katana'){sound(220,.075,'square',.017,90);sound(760,.05,'sine',.008,410)}else if(kind==='ak47'){sound(190,.035,'square',.009,88)}else{sound(125,.1,'sine',.022,56);sound(540,.045,'triangle',.01,190)}}
    weaponHitSound.last={};
    const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
    function beginMove(e){if(G.state!=='playing'||!e.isPrimary)return;const r=screen.getBoundingClientRect(),jx=clamp(e.clientX-r.left,58,width-58),jy=clamp(e.clientY-r.top,ARENA_TOP+58,height-58);input.active=true;input.pointerId=e.pointerId;input.originX=e.clientX;input.originY=e.clientY;joy.style.left=jx-53+'px';joy.style.top=jy-53+'px';joy.style.bottom='auto';joy.classList.add('active');canvas.setPointerCapture(e.pointerId);moveAnywhere(e);e.preventDefault()}
    function moveAnywhere(e){if(!input.active||e.pointerId!==input.pointerId)return;const x=e.clientX-input.originX,y=e.clientY-input.originY,d=Math.hypot(x,y),m=Math.min(31,d),nx=x/(d||1)*m,ny=y/(d||1)*m;input.x=nx/31;input.y=ny/31;stick.style.transform=`translate(${nx}px,${ny}px)`;e.preventDefault()}
    function resetMove(e){if(e&&input.pointerId!==e.pointerId)return;input.x=0;input.y=0;input.active=false;input.pointerId=null;stick.style.transform='translate(0,0)';joy.classList.remove('active');joy.style.left='';joy.style.top='';joy.style.bottom=''}
    canvas.addEventListener('pointerdown',beginMove);canvas.addEventListener('pointermove',moveAnywhere);canvas.addEventListener('pointerup',resetMove);canvas.addEventListener('pointercancel',resetMove);canvas.addEventListener('lostpointercapture',resetMove);
    function selectWeapon(weapon){if(!WEAPONS[weapon])return;const w=WEAPONS[weapon];selectedWeapon=weapon;ui['weapon-number'].textContent=String(Object.keys(WEAPONS).indexOf(weapon)+1).padStart(2,'0');ui['loadout-name'].textContent=w.name;ui['weapon-damage'].textContent=w.damage;ui['weapon-rate'].textContent=(1/w.rate).toFixed(2)+' 次/秒';ui['featured-weapon'].className='weapon-glyph '+weapon}
    function stepWeapon(direction){const weapons=Object.keys(WEAPONS),next=(weapons.indexOf(selectedWeapon)+direction+weapons.length)%weapons.length;selectWeapon(weapons[next])}
    function selectScene(scene){if(!SCENES[scene])return;const s=SCENES[scene];selectedScene=scene;G.scene=scene;ui['scene-stage'].dataset.scene=scene;ui['stage-number'].textContent=String(Object.keys(SCENES).indexOf(scene)+1);ui['scene-name'].textContent=s.name;ui['region-name'].textContent=s.region;ui['start-btn'].textContent=s.enter;ui.objective.textContent=s.opening;buildSceneDecor();draw()}
    function stepScene(direction){const scenes=Object.keys(SCENES),next=(scenes.indexOf(selectedScene)+direction+scenes.length)%scenes.length;selectScene(scenes[next])}
    document.getElementById('prev-weapon').onclick=()=>stepWeapon(-1);
    document.getElementById('next-weapon').onclick=()=>stepWeapon(1);
    document.getElementById('prev-scene').onclick=()=>stepScene(-1);
    document.getElementById('next-scene').onclick=()=>stepScene(1);
    ui.difficulty.oninput=()=>{enemyHpPercent=Number(ui.difficulty.value);ui['difficulty-value'].textContent=enemyHpPercent+'%'};
    ui['start-btn'].onclick=start;document.getElementById('retry').onclick=start;document.getElementById('pause').onclick=pause;document.getElementById('resume').onclick=resume;document.getElementById('quit').onclick=()=>{resetMove();toggle('paused',false);toggle('start',true);G.state='start'};document.getElementById('result-quit').onclick=()=>{resetMove();toggle('result',false);toggle('start',true);G.state='start'};document.getElementById('skill').onclick=useSkill;document.getElementById('sound').onclick=e=>{audioOn=!audioOn;if(audioOn)unlockAudio();e.currentTarget.textContent=audioOn?'◌':'×';e.currentTarget.setAttribute('aria-label',audioOn?'关闭音效':'开启音效')};document.getElementById('help-btn').onclick=()=>{ui.objective.textContent='战场任意位置拖动，右下释放范围技能';setTimeout(()=>{if(G.state==='start')ui.objective.textContent=SCENES[selectedScene].opening},2200)};window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')useSkill();if(e.key==='Escape')G.state==='paused'?resume():pause()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',resetMove);window.addEventListener('resize',resize);
    resize();draw();
  })();
  </script>
