<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <filter id="starFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#starFilter)">
    <!-- 四角耀眼星标 -->
    <path d="M 32 4 Q 32 32 60 32 Q 32 32 32 60 Q 32 32 4 32 Q 32 32 32 4 Z" fill="url(#starGlow)" stroke="#ffffff" stroke-width="1" />
    <!-- 交叉小星芒 -->
    <path d="M 32 14 Q 32 32 50 32 Q 32 32 32 50 Q 32 32 14 32 Q 32 32 32 14 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="32" cy="32" r="4" fill="#ffffff" />
  </g>
</svg>
