<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadowGlow)">
    <!-- 弧形破空棒影 3 重重影 -->
    <path d="M 10 70 Q 100 15 190 35 Q 110 30 20 75 Z" fill="#b91c1c" opacity="0.3" />
    <path d="M 25 65 Q 110 20 185 38 Q 115 34 35 68 Z" fill="#f59e0b" opacity="0.6" />
    <path d="M 45 58 Q 120 25 180 40 Q 125 36 55 60 Z" fill="url(#bladeGrad)" />
    <!-- 棒身疾速残影 -->
    <line x1="40" y1="55" x2="175" y2="40" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.85" />
    <line x1="55" y1="52" x2="165" y2="39" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- 尖端金光迸发 -->
    <circle cx="180" cy="40" r="5" fill="#ffffff" />
    <circle cx="180" cy="40" r="9" fill="#fde047" opacity="0.5" />
  </g>
</svg>
