<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60">
  <defs>
    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 棒身金色外发光与残影 -->
  <g filter="url(#goldGlow)">
    <!-- 虚影弧光/气浪拖尾 -->
    <path d="M 15 30 Q 90 8 165 30 Q 90 20 15 30 Z" fill="#fbbf24" opacity="0.45" />
    <path d="M 25 30 Q 90 14 155 30 Q 90 22 25 30 Z" fill="#fff" opacity="0.6" />
    <!-- 金箍棒主体 -->
    <!-- 中间朱红玄金棒身 -->
    <rect x="36" y="24" width="108" height="12" rx="3" fill="url(#staffGrad)" stroke="#7f1d1d" stroke-width="1.2" />
    <!-- 祥云金纹 -->
    <path d="M 45 30 H 135 M 55 27 H 125 M 60 33 H 120" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    <!-- 左金箍 -->
    <rect x="18" y="22" width="18" height="16" rx="3" fill="url(#goldCap)" stroke="#a16207" stroke-width="1.5" />
    <line x1="24" y1="23" x2="24" y2="37" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="27" cy="30" r="2.5" fill="#fef08a" />
    <!-- 右金箍 -->
    <rect x="144" y="22" width="18" height="16" rx="3" fill="url(#goldCap)" stroke="#a16207" stroke-width="1.5" />
    <line x1="156" y1="23" x2="156" y2="37" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="153" cy="30" r="2.5" fill="#fef08a" />
    <!-- 顶部高光 -->
    <line x1="20" y1="25" x2="160" y2="25" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
